<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manfredi Insinga — PHP developer</title>
<meta name="description" content="Manfredi Insinga, PHP backend and full-stack developer based in Palermo, Italy.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23101420'/><rect x='3' y='3' width='4' height='4' fill='%23e8a03c'/><rect x='9' y='9' width='4' height='4' fill='%235fb3a1'/></svg>">
<style>
  :root{
    --bg:#101420;
    --panel:#171d2c;
    --line:#26304a;
    --ink:#e8eaf2;
    --muted:#98a1bb;
    --amber:#e8a03c;
    --teal:#5fb3a1;
    --focus:#e8a03c;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#eef0f6;
      --panel:#ffffff;
      --line:#d5dae8;
      --ink:#1b2133;
      --muted:#5b6480;
      --amber:#b9701a;
      --teal:#2e7d6d;
      --focus:#b9701a;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-height:100svh;
  }
  main{
    flex:1;
    width:100%;
    max-width:46rem;
    margin:0 auto;
    padding:clamp(2rem,7vw,4.5rem) 1.25rem 2rem;
  }
  /* header */
  .who{
    display:flex;
    align-items:center;
    gap:clamp(.9rem,3vw,1.4rem);
  }
  .avatar{
    width:clamp(72px,18vw,104px);
    height:clamp(72px,18vw,104px);
    flex:none;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--line);
    background:var(--panel);
  }
  .avatar-fallback{
    display:none;
    align-items:center;
    justify-content:center;
    font-size:clamp(1.4rem,5vw,2rem);
    font-weight:600;
    letter-spacing:.02em;
    color:var(--muted);
  }
  h1{
    font-size:clamp(1.65rem,6vw,2.6rem);
    line-height:1.1;
    letter-spacing:-.02em;
    margin:0 0 .35rem;
    font-weight:650;
  }
  .role{
    margin:0;
    color:var(--muted);
    font-size:clamp(.95rem,2.6vw,1.05rem);
  }
  .role b{color:var(--ink);font-weight:600}
  /* scene */
  .scene{
    margin:clamp(2.2rem,8vw,3.5rem) 0 0;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:clamp(1.1rem,4vw,1.8rem);
  }
  .scene svg{display:block;width:100%;height:auto;shape-rendering:crispEdges}
  .scene p{
    margin:1.1rem 0 0;
    color:var(--muted);
    font-size:.95rem;
    max-width:34rem;
  }
  .blink{color:var(--amber);animation:blink 1.4s steps(1,end) infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

  /* walking worker, left to right, then loops */
  .walker{animation:walk 9s linear infinite}
  @keyframes walk{from{transform:translateX(-46px)}to{transform:translateX(206px)}}
  .step-a{animation:stepa .5s steps(2,end) infinite}
  .step-b{animation:stepb .5s steps(2,end) infinite}
  @keyframes stepa{0%,49%{transform:translate(0,0)}50%,100%{transform:translate(2px,-2px)}}
  @keyframes stepb{0%,49%{transform:translate(2px,-2px)}50%,100%{transform:translate(0,0)}}
  .carry{animation:carry .5s steps(2,end) infinite}
  @keyframes carry{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-1px)}}

  /* stacking worker on the right */
  .stacker{animation:bob 1s steps(2,end) infinite}
  @keyframes bob{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-2px)}}
  .arm{transform-origin:150px 34px;animation:place 1.5s steps(3,end) infinite}
  @keyframes place{0%,32%{transform:rotate(0deg)}33%,65%{transform:rotate(-26deg)}66%,100%{transform:rotate(-52deg)}}

  /* crates piling up, then the pile is cleared and it starts again */
  .crate{opacity:0;animation:pile 9s linear infinite}
  .crate:nth-of-type(1){animation-delay:.6s}
  .crate:nth-of-type(2){animation-delay:1.8s}
  .crate:nth-of-type(3){animation-delay:3s}
  .crate:nth-of-type(4){animation-delay:4.2s}
  .crate:nth-of-type(5){animation-delay:5.4s}
  @keyframes pile{
    0%{opacity:0;transform:translateY(-12px)}
    4%{opacity:1;transform:translateY(0)}
    88%{opacity:1;transform:translateY(0)}
    93%,100%{opacity:0;transform:translateY(0)}
  }
  @media (prefers-reduced-motion: reduce){
    .walker,.step-a,.step-b,.carry,.stacker,.arm,.crate,.blink{animation:none;opacity:1;transform:none}
    .walker{transform:translateX(60px)}
  }

  /* footer */
  footer{
    border-top:1px solid var(--line);
    padding:1.4rem 1.25rem 2rem;
  }
  .links{
    width:100%;
    max-width:46rem;
    margin:0 auto;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:.5rem 1.5rem;
    font-size:.95rem;
  }
  .links a{
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    color:var(--ink);
    text-decoration:none;
    padding:.3rem 0;
    border-bottom:1px solid transparent;
  }
  .links a:hover{border-bottom-color:var(--amber)}
  .links a:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:3px;
    border-radius:4px;
  }
  .links svg{width:18px;height:18px;flex:none;fill:currentColor}
  .place{color:var(--muted);margin-left:auto}
  @media (max-width:560px){.place{margin-left:0;width:100%}}
</style>
</head>
<body>
<main>
  <header class="who">
    <img class="avatar" src="photo.png" alt="Manfredi Insinga"
         onerror="this.outerHTML='&lt;div class=\'avatar avatar-fallback\' style=\'display:flex\' aria-hidden=\'true\'&gt;MI&lt;/div&gt;'">
    <div>
      <h1>Manfredi Insinga</h1>
      <p class="role"><b>PHP developer</b> — backend &amp; full-stack</p>
    </div>
  </header>

  <section class="scene" aria-labelledby="building">
    <svg viewBox="0 0 200 70" role="img" aria-label="Pixel-art scene: two workers carrying and stacking crates">
      <!-- ground -->
      <rect x="0" y="58" width="200" height="2" fill="#5fb3a1" opacity=".45"/>

      <!-- crates piling up on the right -->
      <g fill="#e8a03c">
        <rect class="crate" x="166" y="52" width="14" height="6"/>
        <rect class="crate" x="182" y="52" width="14" height="6"/>
        <rect class="crate" x="166" y="44" width="14" height="6"/>
        <rect class="crate" x="182" y="44" width="14" height="6"/>
        <rect class="crate" x="174" y="36" width="14" height="6"/>
      </g>

      <!-- stacking worker -->
      <g class="stacker">
        <rect x="136" y="20" width="14" height="4" fill="#e8a03c"/>
        <rect x="138" y="24" width="10" height="8" fill="#d9b48f"/>
        <rect x="145" y="26" width="2" height="2" fill="#101420"/>
        <rect x="140" y="26" width="2" height="2" fill="#101420"/>
        <rect x="136" y="32" width="14" height="14" fill="#5fb3a1"/>
        <rect x="137" y="46" width="5" height="12" fill="#26304a"/>
        <rect x="144" y="46" width="5" height="12" fill="#26304a"/>
        <g class="arm">
          <rect x="150" y="33" width="10" height="4" fill="#d9b48f"/>
          <rect x="158" y="29" width="10" height="8" fill="#e8a03c"/>
        </g>
      </g>

      <!-- walking worker carrying a crate -->
      <g class="walker">
        <g class="carry">
          <rect x="14" y="18" width="14" height="4" fill="#e8a03c"/>
          <rect x="16" y="22" width="10" height="8" fill="#d9b48f"/>
          <rect x="23" y="24" width="2" height="2" fill="#101420"/>
          <rect x="18" y="24" width="2" height="2" fill="#101420"/>
          <rect x="14" y="30" width="14" height="14" fill="#5fb3a1"/>
          <rect x="28" y="32" width="8" height="4" fill="#d9b48f"/>
          <rect x="34" y="26" width="14" height="12" fill="#e8a03c"/>
          <rect x="34" y="31" width="14" height="2" fill="#101420" opacity=".25"/>
        </g>
        <rect class="step-a" x="15" y="44" width="5" height="14" fill="#26304a"/>
        <rect class="step-b" x="22" y="44" width="5" height="14" fill="#26304a"/>
      </g>
    </svg>
    <p id="building">This page is a work in progress<span class="blink">_</span> In the meantime, the links below are the fastest way to reach me or read my code.</p>
  </section>
</main>

</body>
</html>
